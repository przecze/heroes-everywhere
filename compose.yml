# docker compose up --build, then open http://localhost:8080
services:
  game:
    image: heroes
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205}
    init: true
    # Unprivileged: the image's user "node" (not root), no Linux capabilities, no way to gain privileges, a read-only
    # file system but for the two volumes and a scratch /tmp.
    user: node
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      # Other names this server is reached by (a domain, a machine name), comma-separated; localhost and addresses always work.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    volumes:
      - ./installers:/installers:ro
      - game:/game
      - state:/state
volumes:
  game:
  state:
